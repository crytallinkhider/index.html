    <style>
      :root {
        color-scheme: dark;
      }

      body {
        background: radial-gradient(circle at top, rgba(255, 35, 135, 0.14), transparent 20%),
          radial-gradient(circle at 90% 15%, rgba(52, 168, 255, 0.14), transparent 18%),
          radial-gradient(circle at 20% 85%, rgba(68, 255, 190, 0.10), transparent 16%),
          #05070d;
        min-height: 100vh;
        overflow-x: hidden;
        color: #f4f5ff;
        cursor: none;
      }

      #root {
        position: relative;
        z-index: 1;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        text-shadow: 0 18px 60px rgba(0, 0, 0, 0.22);
      }

      .custom-cursor {
        position: fixed;
        inset: 0 auto auto 0;
        width: 18px;
        height: 18px;
        border: 1.75px solid rgba(255, 255, 255, 0.86);
        border-radius: 9999px;
        pointer-events: none;
        transform: translate(-50%, -50%);
        mix-blend-mode: screen;
        transition: width 0.16s ease, height 0.16s ease, transform 0.16s ease,
          border-color 0.16s ease, background-color 0.16s ease, opacity 0.16s ease;
        opacity: 0.92;
        z-index: 9999;
      }

      .custom-cursor.hover {
        width: 40px;
        height: 40px;
        border-color: rgba(255, 62, 142, 0.98);
        background: rgba(255, 62, 142, 0.14);
      }

      .custom-cursor.clicked {
        transform: translate(-50%, -50%) scale(0.88);
      }

      a,
      button,
      input,
      textarea,
      select {
        cursor: auto;
      }

      @media (hover: none) {
        .custom-cursor {
          display: none;
        }

        body {
          cursor: default;
        }
      }
    </style>
  </head>

  <body class="notranslate" translate="no">
    <div id="root"></div>
    <div class="custom-cursor" id="customCursor"></div>
    <script>
      const cursor = document.getElementById('customCursor');
      let isHovering = false;
      let mouseX = 0;
      let mouseY = 0;

      const updateCursor = () => {
        cursor.style.left = `${mouseX}px`;
        cursor.style.top = `${mouseY}px`;
        requestAnimationFrame(updateCursor);
      };

      window.addEventListener('mousemove', (event) => {
        mouseX = event.clientX;
        mouseY = event.clientY;
      });

      window.addEventListener('mousedown', () => {
        cursor.classList.add('clicked');
      });
      window.addEventListener('mouseup', () => {
        cursor.classList.remove('clicked');
      });

      const hoverTargets = ['a', 'button', 'input', 'textarea', 'select'];
      window.addEventListener('mouseover', (event) => {
        if (hoverTargets.some((selector) => event.target.closest(selector))) {
          cursor.classList.add('hover');
          isHovering = true;
        }
      });
      window.addEventListener('mouseout', (event) => {
        if (hoverTargets.some((selector) => event.target.closest(selector))) {
          cursor.classList.remove('hover');
          isHovering = false;
        }
      });

      updateCursor();
    </script>
  </body>
